name: J96 iOS 15 build check
on:
  push:
    branches: ['j96/ios15-readonly-prep']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate and test
        run: |
          xcodebuild -version
          python3 scripts/check-release.py
          python3 -m unittest discover -s Tests/ReleaseTests
          swift test -j 2
      - name: Build iOS 15 device payload
        run: |
          brew install --force-bottle ldid
          bash scripts/build-device.sh
          sh scripts/package-release.sh j96-ios15-inspect-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j96-ios15-build
          path: |
            out/device/
            out/releases/
          retention-days: 30
          if-no-files-found: error
